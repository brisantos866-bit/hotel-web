{% extends "base.html" %}
{% block contenido %}
<h2>🛏️ Habitaciones</h2>

<form method="post">
  <input name="numero" placeholder="Número" required>
  <select name="tipo">
    <option value="hotel">hotel</option>
    <option value="cuarteria">cuarteria</option>
  </select>
  <input name="capacidad" type="number" value="1" min="1" style="width:80px">
  <input name="precio_dia" type="number" step="0.01" placeholder="Precio/día" required>
  <input name="notas" placeholder="Notas (opcional)">
  <button>➕ Agregar</button>
</form>

<table>
  <tr>
    <th>Número</th><th>Tipo</th><th>Cap.</th><th>Precio/día</th><th>Estado</th><th>Acciones</th>
  </tr>
  {% for h in habitaciones %}
  <tr>
    <form method="post" action="/habitaciones/{{h.id}}/editar">
      <td><input name="numero" value="{{h.numero}}" style="width:80px"></td>
      <td>
        <select name="tipo">
          <option value="hotel" {% if h.tipo=='hotel' %}selected{% endif %}>hotel</option>
          <option value="cuarteria" {% if h.tipo=='cuarteria' %}selected{% endif %}>cuarteria</option>
        </select>
      </td>
      <td><input name="capacidad" type="number" value="{{h.capacidad}}" style="width:60px"></td>
      <td><input name="precio_dia" type="number" step="0.01" value="{{h.precio_dia}}" style="width:90px"></td>
      <td>
        <select name="estado">
          <option value="libre" {% if h.estado=='libre' %}selected{% endif %}>libre</option>
          <option value="ocupada" {% if h.estado=='ocupada' %}selected{% endif %}>ocupada</option>
          <option value="mantenimiento" {% if h.estado=='mantenimiento' %}selected{% endif %}>mantenimiento</option>
        </select>
      </td>
      <td>
        <input name="notas" value="{{h.notas}}" placeholder="notas" style="width:120px">
        <button class="info" type="submit">💾</button>
    </form>
        <form method="post" action="/habitaciones/{{h.id}}/eliminar" style="display:inline"
              onsubmit="return confirm('¿Eliminar habitación {{h.numero}}?')">
          <button class="danger" type="submit">🗑️</button>
        </form>
      </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
