{% extends "base.html" %}
{% block titulo %}Mensajes{% endblock %}
{% block contenido %}
<!-- ... todo tu contenido actual de mensajes ... -->

<!-- NUEVA SECCIÓN: Registro de hotel y PIN por correo -->
<h2 style="margin-top:35px">📨 Registro de hotel y PIN por correo</h2>
<p style="color:#a6adc8">
  Ingresa los datos del hotel. Recibirás un PIN en el correo indicado para acceder.
</p>

<form id="form-registro-hotel" onsubmit="return false;" style="max-width:500px">
  <label>Nombre del hotel:
    <input type="text" id="reg-nombre" required placeholder="Hotel Ejemplo"
           style="width:100%; background:#1e1e2e; color:#cdd6f4;
                  border:1px solid #45475a; padding:8px; border-radius:6px">
  </label>
  <label>Correo electrónico:
    <input type="email" id="reg-email" required placeholder="hotel@correo.com"
           style="width:100%; background:#1e1e2e; color:#cdd6f4;
                  border:1px solid #45475a; padding:8px; border-radius:6px; margin-top:8px">
  </label>
  <button class="ok" type="button" onclick="registrarHotel()" style="margin-top:10px">
    📧 Enviar PIN
  </button>
</form>

<div id="reg-resultado" style="display:none; margin-top:10px"></div>

<script>
async function registrarHotel() {
  const nombre = document.getElementById('reg-nombre').value.trim();
  const email  = document.getElementById('reg-email').value.trim();
  const div    = document.getElementById('reg-resultado');

  if (!nombre || !email) {
    div.style.display = 'block';
    div.className = 'flash error';
    div.textContent = '⚠️ Completa todos los campos.';
    return;
  }

  div.style.display = 'block';
  div.className = 'flash';
  div.textContent = '⏳ Enviando PIN...';

  try {
    const resp = await fetch('/api/registro-hotel', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ nombre, email })
    });
    const data = await resp.json();
    if (data.ok) {
      div.className = 'flash ok';
      div.textContent = '✅ PIN enviado a ' + email + '. Revisa tu correo.';
    } else {
      div.className = 'flash error';
      div.textContent = '❌ ' + (data.error || 'No se pudo enviar.');
    }
  } catch (e) {
    div.className = 'flash error';
    div.textContent = '❌ Error de conexión.';
  }
}
</script>
{% endblock %}
